<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3efe9" />
    <title>암각화몬</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="mode-draw">
    <div id="app">
      <main id="view">
        <canvas id="wall" aria-label="반구대 바위 벽"></canvas>
        <canvas id="trace" aria-label="도면"></canvas>
        <div id="paper"></div>
        <canvas id="ink" aria-label="그림판"></canvas>
        <div id="frame" aria-hidden="true"></div>
        <div id="progress" aria-hidden="true"></div>
        <div class="seg mode-seg" id="modeSeg" role="radiogroup" aria-label="모드">
          <button data-mode="free" role="radio">자유 그리기</button>
          <button data-mode="challenge" role="radio">도전 모드</button>
        </div>
        <button id="placeBtn" class="float-btn">자리 고르기</button>
        <div id="card" class="card" role="dialog" aria-label="제시어">
          <small>제시어</small>
          <strong id="cardLabel"></strong>
          <p id="cardHint"></p>
          <p class="card-time"><span id="cardTime"></span> 안에 그려 보세요</p>
          <div class="card-actions">
            <button id="cardSwap" class="text">다른 제시어</button>
            <button id="cardStart" class="primary">시작</button>
          </div>
        </div>
        <div id="countdown" aria-live="assertive"></div>
        <div id="timer" aria-live="polite">
          <span id="timerLabel"></span><b id="timerNum"></b>
          <button id="timerQuit" aria-label="그만두기">✕</button>
          <i id="timerBar"></i>
        </div>
        <div id="toast" role="status"></div>
        <div id="brand">암각화몬 <span id="step">그리기</span></div>
        <p id="hint">손가락으로 그려 보세요<br /><small>고래 · 사슴 · 사람 · 배</small></p>
        <p id="wallhint">끌어서 이동 · 두 손가락으로 확대</p>
        <div id="zoomCtl" class="zoom">
          <button id="zoomIn" aria-label="확대">+</button>
          <button id="zoomOut" aria-label="축소">−</button>
          <button id="zoomToggle" class="zoom-toggle">전체 보기</button>
        </div>
        <div id="scalebar" aria-hidden="true"><i></i><span></span></div>
        <div id="lab" class="sheet" hidden></div>
        <div id="status">바위를 불러오는 중…</div>
      </main>
      <footer id="panel">
        <div class="tools draw-only">
          <div class="row">
            <div class="chips" id="chips" role="radiogroup" aria-label="색"></div>
            <span class="grow"></span>
            <label class="size" title="굵기">
              <span class="size-well"><i id="sizeDot"></i></span>
              <input id="size" type="range" aria-label="굵기" />
            </label>
          </div>
          <div class="row">
            <button id="undo" class="text">되돌리기</button>
            <button id="clear" class="text">모두 지우기</button>
            <span class="grow"></span>
            <button id="carve" class="primary">새기기</button>
            <button id="done" class="primary">다 그렸어요</button>
          </div>
        </div>
        <div class="tools place-only">
          <p class="place-hint">바위를 움직여 새길 자리를 고르세요<small id="placeMsg"></small></p>
          <span class="grow"></span>
          <button id="placeCancel" class="text">취소</button>
          <button id="placeOk" class="primary">여기에 그리기</button>
        </div>
        <div class="tools result-only">
          <div class="result-head">
            <div class="dial-col">
              <div id="dialHost2"></div>
              <small>측광</small>
            </div>
            <div class="score"><b id="scoreNum">…</b><span>점</span></div>
            <div class="verdict">
              <p class="res-prompt">제시어 <b id="resPrompt"></b> <span id="mockBadge" class="badge" hidden>모의 채점</span></p>
              <p id="resGuess"></p>
              <p id="resComment"></p>
            </div>
          </div>
          <div class="result-actions">
            <button id="retry" class="pill">다시 도전</button>
            <button id="nextPrompt" class="pill">다른 제시어</button>
            <button id="shareRes" class="pill">공유하기</button>
            <button id="postRes" class="primary">벽에 남기기</button>
          </div>
        </div>
        <div class="tools carve-only">
          <div class="carve-main">
          <div class="dial-col">
            <div id="dialHost"></div>
            <small>측광</small>
          </div>
          <div class="col">
            <div class="seg" id="viewSeg" role="radiogroup" aria-label="보기">
              <button data-view="rock" role="radio">바위</button>
              <button data-view="rubbing" role="radio">탁본</button>
              <button data-view="tracing" role="radio">도면</button>
            </div>
            <div class="row">
              <button id="labBtn" class="text" aria-expanded="false">실험실</button>
              <button id="replay" class="text">타임랩스</button>
              <span class="grow"></span>
              <button id="redraw" class="text">다시 그리기</button>
            </div>
          </div>
          </div>
          <div class="carve-actions">
            <button id="shareFree" class="pill">공유하기</button>
            <button id="postFree" class="primary">벽에 남기기</button>
          </div>
        </div>
      </footer>
      <div id="share" class="overlay" hidden>
        <div class="share-box" role="dialog" aria-label="공유하기">
          <div class="share-preview"><img id="sharePreview" alt="공유 이미지 미리보기" /><span class="share-busy">만드는 중…</span></div>
          <label class="share-msg">
            <input id="shareMsg" type="text" enterkeyhint="done" placeholder="남기고 싶은 말 (선택)" autocomplete="off" />
            <small id="shareCount">0/40</small>
          </label>
          <div class="row">
            <div class="seg" id="shareSize" role="radiogroup" aria-label="크기">
              <button data-size="story" role="radio">스토리 9:16</button>
              <button data-size="square" role="radio">정사각 1:1</button>
            </div>
          </div>
          <div class="row">
            <button id="shareClose" class="text">닫기</button>
            <span class="grow"></span>
            <button id="shareSave" class="pill">저장</button>
            <button id="shareGo" class="primary">공유하기</button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
